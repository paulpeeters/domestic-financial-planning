services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?Set TRAEFIK_ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt

  web:
    labels:
      - traefik.enable=true
      - traefik.http.routers.financial-planning.rule=Host(`${APP_HOST:?Set APP_HOST in .env}`)
      - traefik.http.routers.financial-planning.entrypoints=websecure
      - traefik.http.routers.financial-planning.tls=true
      - traefik.http.routers.financial-planning.tls.certresolver=letsencrypt
      - traefik.http.services.financial-planning.loadbalancer.server.port=8080

volumes:
  traefik_letsencrypt:
