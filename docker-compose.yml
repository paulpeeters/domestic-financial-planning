services:
  db:
    image: mariadb:11.7
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: Server=db;Port=3306;Database=${DB_NAME};User ID=${DB_USER};Password=${DB_PASSWORD};Allow User Variables=true;
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  db_data:
  uploads:
